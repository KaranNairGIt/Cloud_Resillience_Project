apiVersion: v1
kind: Service
metadata:
  name: resilience-peer-portal
  namespace: resilience
spec:
  selector:
    app.kubernetes.io/name: resilience-peer
    resilience-node: portal
  ports:
    - name: mtls-peer
      port: 8766
      targetPort: 8766
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-peer-portal
  namespace: resilience
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resilience-peer
      resilience-node: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resilience-peer
        resilience-node: portal
    spec:
      serviceAccountName: resilience-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: peer
          image: distributed-cyber-resilience:dev
          imagePullPolicy: Never
          command: ["python", "-m", "resilience.cli", "peer", "serve"]
          args: ["--node-id", "portal", "--host", "0.0.0.0", "--port", "8766", "--pki-dir", "/var/run/resilience-pki", "--key-dir", "/var/run/resilience-keys", "--state-dir", "/var/lib/resilience/state"]
          env:
            # Minimum spacing between counted clean windows for Kubernetes reintegration.
            - name: RESILIENCE_MIN_WINDOW_SECONDS
              value: "30"
          ports:
            - name: mtls-peer
              containerPort: 8766
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: mtls-peer
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mtls-peer
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: peer-tls
              mountPath: /var/run/resilience-pki
              readOnly: true
            - name: signing-key
              mountPath: /var/run/resilience-keys/private
              readOnly: true
            - name: public-keys
              mountPath: /var/run/resilience-keys/public
              readOnly: true
            - name: replica-state
              mountPath: /var/lib/resilience/state
      volumes:
        - name: peer-tls
          secret:
            secretName: resilience-tls-portal
            defaultMode: 0440
            items:
              - key: tls.crt
                path: portal.crt
              - key: tls.key
                path: portal.key
              - key: ca.crt
                path: ca.crt
        - name: signing-key
          secret:
            secretName: pbft-signing-portal
            defaultMode: 0440
            items:
              - key: signing-key.pem
                path: portal.pem
        - name: public-keys
          configMap:
            name: pbft-public-keys
            defaultMode: 0444
        - name: replica-state
          persistentVolumeClaim:
            claimName: resilience-state-portal
---
