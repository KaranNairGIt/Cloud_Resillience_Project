apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-demo-records
  namespace: resilience-lab
  labels:
    app.kubernetes.io/name: resilience-demo-records
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resilience-demo-records
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resilience-demo-records
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-workload
          image: distributed-cyber-resilience:dev
          imagePullPolicy: Never
          command: ["python", "-m", "resilience.demo_workload"]
          ports:
            - name: http-demo
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-demo
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-demo
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: resilience-demo-records
  namespace: resilience-lab
spec:
  selector:
    app.kubernetes.io/name: resilience-demo-records
  ports:
    - name: http-demo
      port: 8080
      targetPort: http-demo
      protocol: TCP
